# Continuous integration: typecheck, test and build.
#
# Runs on every pull request into main and on every merge. Deliberately holds no
# secrets - publishing lives in azure-pipelines-release.yml, so the Marketplace
# token is never available to a build triggered by a pull request.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: 20.x

steps:
  - task: NodeTool@0
    displayName: Use Node $(nodeVersion)
    inputs:
      versionSpec: $(nodeVersion)

  - script: npm ci
    displayName: Install

  - script: npx tsc --noEmit
    displayName: Typecheck

  # --watchAll=false because react-scripts otherwise waits for changes.
  - script: npm test -- --watchAll=false
    displayName: Test
    env:
      CI: true

  - script: npm run build
    displayName: Build
    env:
      CI: true
