# Verifies a pull request the same way a release does: typecheck, tests, build.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # --watchAll=false because react-scripts otherwise waits for changes.
      # GitHub sets CI=true, but being explicit keeps this usable by hand.
      - name: Test
        run: npm test -- --watchAll=false
      - name: Build
        run: npm run build
